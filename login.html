<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Đăng nhập quản trị · linhLink Pet House</title>
<style>
:root {
  --bg: #f5f9ff; --surface: #ffffff; --ink: #16213e; --muted: #4f5d7c; --line: #cfd8ea;
  --accent: #ffd23f; --on-accent: #16213e; --danger: #b3261e; --ok: #1b6b46;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11172c; --surface: #1a2240; --ink: #f1f4ff; --muted: #a8b3d3; --line: #33406b;
    --accent: #f7c92f; --danger: #ff8a80; --ok: #7fdcae; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11172c; --surface: #1a2240; --ink: #f1f4ff; --muted: #a8b3d3; --line: #33406b;
  --accent: #f7c92f; --danger: #ff8a80; --ok: #7fdcae; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; min-height: 100vh;
  display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
form { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; }
input { font: inherit; min-height: 42px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; font-weight: 400; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; cursor: pointer; }
.btn[disabled] { opacity: .6; cursor: default; }
.msg { margin: 0; font-size: 14px; }
.msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
.back { font-size: 14px; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Đăng nhập quản trị</h1>
    <p class="sub">linhLink Pet House. Chỉ dành cho chủ shop.</p>
    <p class="msg err" id="cfgMsg" hidden>Chưa cấu hình kết nối. Hãy điền SUPABASE_URL và SUPABASE_KEY trong file config.js.</p>
    <form id="loginForm">
      <label>Email<input type="email" id="email" autocomplete="username" required></label>
      <label>Mật khẩu<input type="password" id="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="loginBtn">Đăng nhập</button>
      <p class="msg" id="msg" hidden></p>
    </form>
  </div>
  <a class="back" href="index.html">← Về trang bán hàng</a>
</main>

<script src="config.js"></script>
<script src="admin-auth.js"></script>
<script>
(function () {
  var Auth = window.LLAuth;
  var $ = function (id) { return document.getElementById(id); };
  function setMsg(text, kind) { $("msg").textContent = text || ""; $("msg").className = "msg" + (kind ? " " + kind : ""); $("msg").hidden = !text; }

  if (!Auth.configured()) { $("cfgMsg").hidden = false; $("loginForm").hidden = true; return; }
  if (Auth.hasSession()) { Auth.goHome(); return; }
  if (/[?&]expired=1/.test(location.search)) setMsg("Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.", "err");

  $("loginForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    $("loginBtn").disabled = true; setMsg("Đang đăng nhập...", "");
    Auth.login($("email").value.trim(), $("password").value)
      .then(function () { Auth.goHome(); })
      .catch(function (e) { setMsg(e.message, "err"); $("loginBtn").disabled = false; });
  });
})();
</script>
</body>
</html>
